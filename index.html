<!DOCTYPE html>

  <!-- Same typefaces as the portfolio: EB Garamond (headings) and Inter (text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <main class="card">
    <header class="intro">

    <!-- Without JavaScript these two are plain links to the PDFs; script.js turns them into expanding viewers. -->
    <a class="button button--primary button--portfolio" href="portfolio.pdf" target="_blank" rel="noopener" data-viewer="portfolio-viewer">
      <span>Portfolio</span>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </a>

    <section class="viewer" id="portfolio-viewer" aria-label="Portfolio" hidden>
      <div class="viewer__bar">
        <span class="viewer__title">Portfolio</span>
        <a class="viewer__link" href="portfolio.pdf" target="_blank" rel="noopener">
          Open PDF
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
        </a>
        <button class="viewer__close" type="button" aria-label="Close portfolio">

      </div>
      <div class="viewer__pages">
        <img src="pages/portfolio-1.jpg" width="1599" height="900" alt="Portfolio, page 1 of 6: cover" loading="lazy" decoding="async">
        <img src="pages/portfolio-2.jpg" width="1599" height="900" alt="Portfolio, page 2 of 6: Terrain Emulation Treadmill" loading="lazy" decoding="async">
        <img src="pages/portfolio-3.jpg" width="1599" height="900" alt="Portfolio, page 3 of 6: FireDome launcher fabrication" loading="lazy" decoding="async">

        <img src="pages/portfolio-5.jpg" width="1599" height="900" alt="Portfolio, page 5 of 6: valve and detonation mechanism" loading="lazy" decoding="async">
        <img src="pages/portfolio-6.jpg" width="1599" height="900" alt="Portfolio, page 6 of 6: more projects" loading="lazy" decoding="async">
      </div>
    </section>

    <a class="button button--accent button--resume" href="resume.pdf" target="_blank" rel="noopener" data-viewer="resume-viewer">
      <span>Resume</span>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </a>

    <section class="viewer" id="resume-viewer" aria-label="Resume" hidden>
      <div class="viewer__bar">
        <span class="viewer__title">Resume</span>
        <a class="viewer__link" href="resume.pdf" target="_blank" rel="noopener">
          Open PDF
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>

        <img src="pages/resume-1.png" width="1600" height="2070" alt="Resume, page 1 of 1" loading="lazy" decoding="async">
